server:
  port: ${PORT:8081}
  error:
    include-message: always

spring:
  config:
    import: "optional:file:.env[.properties],optional:file:backend/.env[.properties]"
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/knowledge-vault;AUTO_SERVER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

vault:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  storage-directory: ${VAULT_STORAGE_DIR:./uploads}
  jwt-secret: ${VAULT_JWT_SECRET:local-development-secret-change-before-deploying-1234567890}
  jwt-expiration-hours: 24
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    chat-model: ${OLLAMA_CHAT_MODEL:llama3.2:3b}
    embedding-model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}
